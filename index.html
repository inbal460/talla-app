<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכנית לימודים אישית - המסע שלי</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-bg: #e0f2fe;
            --primary-blue: #1e3a8a;
            --card-border: #38bdf8;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(180deg, #bae6fd 0%, #f0f9ff 100%);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            direction: rtl;
            min-height: 100vh;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 25px;
            border: 3px solid #7dd3fc;
            position: relative;
        }

        /* כותרת מרוכזת */
        .top-banner {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px dashed #93c5fd;
            padding-bottom: 20px;
        }

        .main-title {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* תיבת פרטים אישיים */
        .personal-details-box {
            background: #fff;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 16px 25px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
            max-width: 750px;
            margin: 0 auto;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            text-align: right;
        }

        .details-grid label {
            font-size: 14px;
            font-weight: 700;
            color: #0369a1;
            display: block;
            margin-bottom: 6px;
        }

        .details-grid input {
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
        }

        /* גריד 3 עמודות */
        .flight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        @media (max-width: 850px) {
            .flight-grid { grid-template-columns: 1fr; }
        }

        .flight-column {
            background: #ffffff;
            border: 3px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            position: relative;
        }

        .col-header {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-blue);
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* אייקונים מוגדלים */
        .visual-icon {
            font-size: 22px;
            display: inline-block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            min-height: 110px;
            background: #f8fafc;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .speech-btn {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            align-self: flex-start;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .speech-btn:hover { background: #bae6fd; }

        /* חתימות בתחתית */
        .signatures {
            margin-top: 35px;
            border-top: 2px dashed #93c5fd;
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .sig-box {
            background: #f8fafc;
            padding: 18px 12px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        .sig-line {
            margin-top: 45px;
            border-top: 2px solid #475569;
        }

        /* כפתורי פעולה */
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .btn-submit { background: #10b981; color: white; }
        .btn-submit:hover { background: #059669; transform: translateY(-2px); }

        .btn-pdf { background: #0284c7; color: white; }
        .btn-pdf:hover { background: #0369a1; transform: translateY(-2px); }

        #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }

        /* ==========================================
           הגדרות הדפסה ל-A4
           ========================================== */
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .actions, .speech-btn, #statusMsg {
                display: none !important;
            }

            .top-banner {
                margin-bottom: 18px !important;
                padding-bottom: 15px !important;
            }

            .main-title {
                font-size: 28px !important;
                margin-bottom: 12px !important;
            }

            .personal-details-box {
                padding: 12px 20px !important;
            }

            .flight-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 15px !important;
                margin-top: 20px !important;
            }

            .flight-column {
                padding: 15px !important;
                border-width: 2px !important;
                border-radius: 16px !important;
                gap: 14px !important;
            }

            .col-header {
                font-size: 18px !important;
                padding-bottom: 8px !important;
            }

            label {
                font-size: 13px !important;
            }

            textarea {
                min-height: 95px !important;
                font-size: 13px !important;
                padding: 8px !important;
                border-width: 1px !important;
            }

            #howToAchieve {
                min-height: 280px !important;
            }

            .signatures {
                margin-top: 25px !important;
                padding-top: 18px !important;
                gap: 15px !important;
            }

            .sig-box {
                padding: 12px !important;
                font-size: 13px !important;
            }

            .sig-line {
                margin-top: 45px !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- כותרת ממורכזת + פרטים -->
    <div class="top-banner">
        <div class="main-title">
            <i class="fa-solid fa-plane-departure" style="color: #0284c7;"></i>
            תכנית לימודים אישית
        </div>
        
        <!-- פרטים אישיים -->
        <div class="personal-details-box">
            <div class="details-grid">
                <div>
                    <label>שם מלא:</label>
                    <input type="text" id="fullName" placeholder="שם פרטי ומשפחה">
                </div>
                <div>
                    <label>כיתה:</label>
                    <input type="text" id="grade" placeholder="למשל: י&quot;ב">
                </div>
                <div>
                    <label>תאריך:</label>
                    <input type="date" id="date">
                </div>
            </div>
        </div>
    </div>

    <!-- 3 העמודות -->
    <form id="talaForm">
        <div class="flight-grid">
            
            <!-- עמודה 1: המסע שלי (שביל מסומן) -->
            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🛣️</span>
                    המסע שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💭</span> החלומות שלי:</label>
                    <textarea id="dreams" placeholder="מה היית רוצה להגשים?"></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('dreams')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💪</span> החוזקות שלי:</label>
                    <textarea id="strengths" placeholder="במה אני טוב/ה?"></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('strengths')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🚧</span> המעכבים שלי:</label>
                    <textarea id="challenges" placeholder="מה מאתגר אותי?"></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('challenges')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <!-- עמודה 2: המטרות שלי (לוח מטרה) -->
            <div class="flight-column" style="border-color: #0284c7;">
                <div class="col-header">
                    <span class="visual-icon">🎯</span>
                    המטרות שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">📚</span> תחום לימודי:</label>
                    <textarea id="academicGoals" placeholder="מטרה לימודית..."></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('academicGoals')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🤝</span> תחום חברתי:</label>
                    <textarea id="socialGoals" placeholder="מטרה חברתית..."></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('socialGoals')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">❤️</span> מטרות אישיות:</label>
                    <textarea id="personalGoals" placeholder="מטרה אישית..."></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('personalGoals')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <!-- עמודה 3: דרך הפעולה (מפת מסע) -->
            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🗺️</span>
                    דרך הפעולה
                </div>

                <div class="form-group" style="flex:1;">
                    <label><span class="visual-icon">🚀</span> איך אשיג את המטרות שלי?</label>
                    <textarea id="howToAchieve" placeholder="צעדים מעשיים והעזרה שאצטרך..."></textarea>
                    <button type="button" class="speech-btn" onclick="startSpeech('howToAchieve')"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

        </div>

        <!-- חתימות -->
        <div class="signatures">
            <div class="sig-box">
                <strong>חתימת התלמיד/ה</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת המחנכ/ת</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת ההורה</strong>
                <div class="sig-line"></div>
            </div>
        </div>

        <!-- כפתורי פעולה -->
        <div class="actions">
            <button type="button" class="btn btn-submit" onclick="sendToGoogleSheets()">
                <i class="fa-solid fa-paper-plane"></i> שמור ושגר לגיליון המרכזי
            </button>
            <button type="button" class="btn btn-pdf" onclick="window.print()">
                <i class="fa-solid fa-file-pdf"></i> הדפס / שמור כ-PDF
            </button>
        </div>
        <div id="statusMsg"></div>
    </form>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziopItKL8xyngsdIe9CfN7QW9pJ0RlBkn4Go2avZxBkQWPMR_zYSkYQG8qtbuJ19V2kw/exec";

    document.getElementById('date').valueAsDate = new Date();

    const fields = ['fullName', 'grade', 'date', 'dreams', 'strengths', 'challenges', 'academicGoals', 'socialGoals', 'personalGoals', 'howToAchieve'];
    
    fields.forEach(id => {
        const el = document.getElementById(id);
        const saved = localStorage.getItem('tala_' + id);
        if (saved) el.value = saved;
        
        el.addEventListener('input', () => {
            localStorage.setItem('tala_' + id, el.value);
        });
    });

    function startSpeech(fieldId) {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('הדפדפן שלך אינו תומך בהקלטה קולית. מומלץ להשתמש בדפדפן Chrome.');
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'he-IL';
        
        const btn = event.currentTarget;
        btn.style.background = '#fef08a';
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מקליט...';

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            const field = document.getElementById(fieldId);
            field.value += (field.value ? ' ' : '') + transcript;
            field.dispatchEvent(new Event('input'));
            btn.style.background = '#e0f2fe';
            btn.innerHTML = '<i class="fa-solid fa-microphone"></i> הקלט תשובה';
        };

        recognition.onerror = function() {
            btn.style.background = '#e0f2fe';
            btn.innerHTML = '<i class="fa-solid fa-microphone"></i> הקלט תשובה';
        };

        recognition.start();
    }

    function sendToGoogleSheets() {
        const status = document.getElementById('statusMsg');
        status.style.color = '#0284c7';
        status.innerText = '✈️ שולח נתונים לגיליון... אנא המתן';

        const payload = {
            fullName: document.getElementById('fullName').value,
            grade: document.getElementById('grade').value,
            date: document.getElementById('date').value,
            dreams: document.getElementById('dreams').value,
            strengths: document.getElementById('strengths').value,
            challenges: document.getElementById('challenges').value,
            academicGoals: document.getElementById('academicGoals').value,
            socialGoals: document.getElementById('socialGoals').value,
            personalGoals: document.getElementById('personalGoals').value,
            howToAchieve: document.getElementById('howToAchieve').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            status.style.color = '#10b981';
            status.innerText = '🎉 הנתונים נשמרו בהצלחה בגיליון ה-Google Sheets המרכזי!';
        })
        .catch(err => {
            status.style.color = '#ef4444';
            status.innerText = 'שגיאה בשליחת הנתונים: ' + err.message;
        });
    }
</script>

</body>
</html>
