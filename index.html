<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכנית לימודים אישית - המסע שלי</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --sky-bg: #e0f2fe;
            --primary-blue: #1e3a8a;
            --card-border: #38bdf8;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(180deg, #bae6fd 0%, #f0f9ff 100%);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            direction: rtl;
            min-height: 100vh;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 25px;
            border: 3px solid #7dd3fc;
            position: relative;
            text-align: right;
        }

        .top-banner {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #93c5fd;
            padding-bottom: 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .personal-details-box {
            background: #fff;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 16px 25px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
            max-width: 750px;
            margin: 0 auto;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: right;
        }

        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
        }

        .details-grid label {
            font-size: 14px;
            font-weight: 700;
            color: #0369a1;
            display: block;
            margin-bottom: 6px;
            text-align: right;
        }

        .details-grid input {
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
            text-align: right;
            direction: rtl;
        }

        /* עיצוב ייעודי לשדה התאריך למניעת הפיכת הסדר */
        #date {
            direction: ltr !important;
            text-align: right !important;
        }

        .flight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        @media (max-width: 850px) {
            .flight-grid { grid-template-columns: 1fr; }
        }

        .flight-column {
            background: #ffffff;
            border: 3px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            position: relative;
            text-align: right;
        }

        .col-header {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-blue);
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        label {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            text-align: right;
        }

        .visual-icon {
            font-size: 22px;
            display: inline-block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            min-height: 110px;
            background: #f8fafc;
            line-height: 1.5;
            text-align: right;
            direction: rtl;
        }

        textarea:focus {
            outline: none;
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .speech-btn {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            align-self: flex-start;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .speech-btn.recording {
            background: #ef4444 !important;
            color: white !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .signatures {
            margin-top: 35px;
            border-top: 2px dashed #93c5fd;
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .sig-box {
            background: #f8fafc;
            padding: 18px 12px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        .sig-line {
            margin-top: 45px;
            border-top: 2px solid #475569;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .btn-submit { background: #10b981; color: white; }
        .btn-submit:hover { background: #059669; }

        .btn-image { background: #0284c7; color: white; }
        .btn-image:hover { background: #0369a1; }

        .btn-reset { background: #f59e0b; color: white; }
        .btn-reset:hover { background: #d97706; }

        .btn:disabled {
            background: #cbd5e1 !important;
            color: #64748b !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            opacity: 0.7;
        }

        /* הודעת סטטוס מחוץ לכרטיס המודפס */
        #statusMsg {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container" id="talaCard">
    
    <div class="top-banner">
        <div class="main-title">
            <i class="fa-solid fa-plane-departure" style="color: #0284c7;"></i>
            תכנית לימודים אישית
        </div>
        
        <div class="personal-details-box">
            <div class="details-grid" id="detailsGrid">
                <div>
                    <label>שם מלא:</label>
                    <input type="text" id="fullName" placeholder="שם פרטי ומשפחה">
                </div>
                <div>
                    <label>כיתה:</label>
                    <input type="text" id="grade" placeholder="למשל: י&quot;ב">
                </div>
                <div>
                    <label>תאריך:</label>
                    <input type="text" id="date" placeholder="DD/MM/YYYY">
                </div>
            </div>
        </div>
    </div>

    <form id="talaForm">
        <div class="flight-grid" id="flightGrid">
            
            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🛣</span>
                    המסע שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💭</span> החלומות שלי:</label>
                    <textarea id="dreams" placeholder="מה היית רוצה להגשים?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('dreams', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💪</span> החוזקות שלי:</label>
                    <textarea id="strengths" placeholder="במה אני טוב/ה?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('strengths', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🚧</span> המעכבים שלי:</label>
                    <textarea id="challenges" placeholder="מה מאתגר אותי?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('challenges', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <div class="flight-column" style="border-color: #0284c7;">
                <div class="col-header">
                    <span class="visual-icon">🎯</span>
                    המטרות שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">📚</span> תחום לימודי:</label>
                    <textarea id="academicGoals" placeholder="מטרה לימודית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('academicGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🤝</span> תחום חברתי:</label>
                    <textarea id="socialGoals" placeholder="מטרה חברתית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('socialGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">❤️</span> מטרות אישיות:</label>
                    <textarea id="personalGoals" placeholder="מטרה אישית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('personalGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🗺️</span>
                    דרך הפעולה
                </div>

                <div class="form-group" style="flex:1;">
                    <label><span class="visual-icon">🚀</span> איך אשיג את המטרות שלי?</label>
                    <textarea id="howToAchieve" placeholder="צעדים מעשיים והעזרה שאצטרך..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('howToAchieve', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

        </div>

        <div class="signatures">
            <div class="sig-box">
                <strong>חתימת התלמיד/ה</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת המחנכ/ת</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת ההורה</strong>
                <div class="sig-line"></div>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-submit" onclick="sendToGoogleSheets()">
                <i class="fa-solid fa-paper-plane"></i> 1. שמור ושגר לגיליון
            </button>
            <button type="button" id="btnImage" class="btn btn-image" onclick="downloadAsA4Image()" disabled title="יש לשמור תחילה את הנתונים בגיליון">
                <i class="fa-solid fa-image"></i> 2. הורד תמונה לגלרייה (A4)
            </button>
            <button type="button" class="btn btn-reset" onclick="resetForm()">
                <i class="fa-solid fa-rotate-right"></i> טופס חדש
            </button>
        </div>
    </form>
</div>

<!-- הודעת סטטוס מחוץ למכולה המצולמת -->
<div id="statusMsg">⚠️ יש ללחוץ על "שמור ושגר לגיליון" לפני שניתן להוריד את התמונה.</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyPsVFHyRzHgLtlnTy7WbN31m8P2mgbA3_-Z3WjkQs34_ShKuhJOMZQzwB8U9yPFBj8g/exec";

    // יצירת פורמט תאריך ישראלי מפורש: DD/MM/YYYY
    function getTodayIsraeliDate() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    const dateField = document.getElementById('date');
    if (!localStorage.getItem('tala_date')) {
        dateField.value = getTodayIsraeliDate();
    }

    const fields = ['fullName', 'grade', 'date', 'dreams', 'strengths', 'challenges', 'academicGoals', 'socialGoals', 'personalGoals', 'howToAchieve'];
    
    fields.forEach(id => {
        const el = document.getElementById(id);
        const saved = localStorage.getItem('tala_' + id);
        if (saved) el.value = saved;
        
        el.addEventListener('input', () => {
            localStorage.setItem('tala_' + id, el.value);
            lockActions();
        });
    });

    function lockActions() {
        document.getElementById('btnImage').disabled = true;
        const status = document.getElementById('statusMsg');
        status.style.color = '#d97706';
        status.innerText = '⚠️ בוצעו שינויים - יש ללחוץ על "1. שמור ושגר לגיליון" כדי לאפשר הורדת תמונה.';
    }

    function unlockActions() {
        document.getElementById('btnImage').disabled = false;
    }

    function sendToGoogleSheets() {
        const fullName = document.getElementById('fullName').value.trim();
        if (!fullName) {
            alert('אנא הזן שם מלא לפני השמירה.');
            return;
        }

        const status = document.getElementById('statusMsg');
        status.style.color = '#0284c7';
        status.innerText = '✈️ שולח נתונים לגיליון... אנא המתן';

        const payload = {
            fullName: fullName,
            grade: document.getElementById('grade').value,
            date: document.getElementById('date').value,
            dreams: document.getElementById('dreams').value,
            strengths: document.getElementById('strengths').value,
            challenges: document.getElementById('challenges').value,
            academicGoals: document.getElementById('academicGoals').value,
            socialGoals: document.getElementById('socialGoals').value,
            personalGoals: document.getElementById('personalGoals').value,
            howToAchieve: document.getElementById('howToAchieve').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            status.style.color = '#10b981';
            status.innerText = '🎉 הנתונים נשמרו בגיליון! כעת לחץ על "2. הורד תמונה לגלרייה" כדי לשמור את התמונה ולשלוח למורה ב-WhatsApp.';
            unlockActions();
        })
        .catch(err => {
            status.style.color = '#ef4444';
            status.innerText = 'שגיאה בשליחת הנתונים: ' + err.message;
        });
    }

    function downloadAsA4Image() {
        const status = document.getElementById('statusMsg');
        status.style.color = '#0284c7';
        status.innerText = '📸 מייצר תמונה מעוצבת בפורמט A4... אנא המתן';

        const card = document.getElementById('talaCard');
        const speechBtns = document.querySelectorAll('.speech-btn');
        const actionsBox = document.querySelector('.actions');
        const flightGrid = document.getElementById('flightGrid');
        const detailsGrid = document.getElementById('detailsGrid');

        speechBtns.forEach(btn => btn.style.display = 'none');
        actionsBox.style.display = 'none';

        const originalWidth = card.style.width;
        card.style.width = '1000px';
        flightGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';
        detailsGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';

        html2canvas(card, {
            scale: 2,
            useCORS: true,
            windowWidth: 1200,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            card.style.width = originalWidth;
            flightGrid.style.gridTemplateColumns = '';
            detailsGrid.style.gridTemplateColumns = '';
            speechBtns.forEach(btn => btn.style.display = 'flex');
            actionsBox.style.display = 'flex';

            const name = document.getElementById('fullName').value || 'תלמיד';
            const link = document.createElement('a');
            link.download = `תלא_${name}.png`.replace(/\s+/g, '_');
            link.href = canvas.toDataURL('image/png');
            link.click();

            status.style.color = '#10b981';
            status.innerText = '🖼️ התמונה המעוצבת נשמרה בגלריית המכשיר! כעת נכנסים ל-WhatsApp ושולחים אותה למורה.';
        }).catch(err => {
            card.style.width = originalWidth;
            flightGrid.style.gridTemplateColumns = '';
            detailsGrid.style.gridTemplateColumns = '';
            speechBtns.forEach(btn => btn.style.display = 'flex');
            actionsBox.style.display = 'flex';
            status.style.color = '#ef4444';
            status.innerText = 'שגיאה ביצירת התמונה: ' + err.message;
        });
    }

    function resetForm() {
        if (confirm('האם למחוק את כל התשובות מהמסך ולהתחיל טופס חדש?')) {
            fields.forEach(id => {
                const el = document.getElementById(id);
                el.value = '';
                localStorage.removeItem('tala_' + id);
            });
            document.getElementById('date').value = getTodayIsraeliDate();
            lockActions();
            const status = document.getElementById('statusMsg');
            status.style.color = '#f59e0b';
            status.innerText = '🧹 הטופס נוקה בהצלחה! יש למלא ולשמור לפני הורדת תמונה.';
        }
    }

    let currentRecognition = null;
    let currentBtn = null;

    function toggleSpeech(fieldId, btn) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('הדפדפן במכשיר זה אינו תומך בזיהוי קולי. מומלץ להשתמש בדפדפן Chrome.');
            return;
        }

        if (currentRecognition) {
            currentRecognition.stop();
            return;
        }

        const field = document.getElementById(fieldId);
        const initialText = field.value;

        currentRecognition = new SpeechRecognition();
        currentRecognition.lang = 'he-IL';
        currentRecognition.continuous = true;
        currentRecognition.interimResults = true;

        currentBtn = btn;
        btn.classList.add('recording');
        btn.innerHTML = '<i class="fa-solid fa-stop"></i> לחץ לסיום הקלטה';

        currentRecognition.onresult = function(event) {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                field.value = initialText + (initialText ? ' ' : '') + finalTranscript;
                field.dispatchEvent(new Event('input'));
            }
        };

        currentRecognition.onerror = function(event) {
            console.error("Speech recognition error:", event.error);
            stopSpeech();
        };

        currentRecognition.onend = function() {
            stopSpeech();
        };

        try {
            currentRecognition.start();
        } catch (e) {
            stopSpeech();
        }
    }

    function stopSpeech() {
        if (currentBtn) {
            currentBtn.classList.remove('recording');
            currentBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> הקלט תשובה';
        }
        currentRecognition = null;
        currentBtn = null;
    }
</script>

</body>
</html>
