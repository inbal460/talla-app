<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תל"א - תכנית לימודים אישית</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0f172a;
            --border-color: #cbd5e1;
            --tala-color: #0284c7;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Rubik', sans-serif;
            background-color: #ffffff;
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            direction: rtl;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #bae6fd;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08);
            position: relative;
            text-align: right;
        }

        /* כותרת עם לוגו והדגשת ת.ל.א */
        .top-banner {
            position: relative;
            margin-bottom: 25px;
            border-bottom: 2px dashed #bae6fd;
            padding-bottom: 22px;
        }

        .logo-header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .header-logo-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15);
        }

        .main-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent);
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* עיצוב צבעוני מודגש לאותיות ת.ל.א */
        .tala-letter {
            color: var(--tala-color);
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid #7dd3fc;
            font-size: 34px;
            display: inline-block;
        }

        /* מלבן פרטים אישיים - מתוח ברוחב מלא ועם צבע חי */
        .personal-details-box {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 18px 22px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.12);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: right;
            width: 100%;
        }

        @media (max-width: 650px) {
            .details-grid { grid-template-columns: 1fr; }
        }

        .details-grid label {
            font-size: 14px;
            font-weight: 800;
            color: #0369a1;
            display: block;
            margin-bottom: 6px;
            text-align: right;
        }

        .details-grid input {
            padding: 11px 14px;
            border: 2px solid #93c5fd;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-align: right;
            direction: rtl;
        }

        .details-grid input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        #date {
            direction: ltr !important;
            text-align: center !important;
        }

        /* גריד 3 עמודות מעוצב */
        .flight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 25px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .flight-grid { grid-template-columns: 1fr; }
        }

        .flight-column {
            background: #ffffff;
            border: 2px solid #7dd3fc;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            position: relative;
            text-align: right;
        }

        .col-header {
            font-size: 21px;
            font-weight: 800;
            color: var(--primary-dark);
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        label {
            font-weight: 800;
            font-size: 15px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            text-align: right;
        }

        .visual-icon {
            font-size: 22px;
            display: inline-block;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            min-height: 110px;
            background: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .speech-btn {
            background: #f0f9ff;
            color: #0284c7;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            align-self: flex-start;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .speech-btn:hover {
            background: #e0f2fe;
        }

        .speech-btn.recording {
            background: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.65; }
            100% { opacity: 1; }
        }

        /* חתימות להדפסה */
        .signatures {
            margin-top: 35px;
            border-top: 2px dashed #bae6fd;
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .sig-box {
            background: #ffffff;
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            font-weight: 700;
            color: #334155;
        }

        .sig-line {
            margin-top: 40px;
            border-top: 2px solid #64748b;
        }

        /* כפתורי פעולה */
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }

        .btn-submit { background: #059669; color: white; }
        .btn-submit:hover { background: #047857; transform: translateY(-1px); }

        .btn-image { background: #0284c7; color: white; }
        .btn-image:hover { background: #0369a1; transform: translateY(-1px); }

        .btn-reset { background: #d97706; color: white; }
        .btn-reset:hover { background: #b45309; transform: translateY(-1px); }

        .btn:disabled {
            background: #cbd5e1 !important;
            color: #64748b !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            opacity: 0.75;
        }

        #statusMsg {
            text-align: center;
            margin-top: 20px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container" id="talaCard">

            <img src="תל”א.jpg" alt="לוגו תל''א" class="header-logo-img">
            <h1 class="main-title">
                <span class="tala-letter">ת</span>כנית <span class="tala-letter">ל</span>ימודים <span class="tala-letter">א</span>ישית
            </h1>
        </div>

            <div class="details-grid" id="detailsGrid">

                    <input type="text" id="fullName" placeholder="שם פרטי ומשפחה">

                    <input type="text" id="grade" placeholder="למשל: י&quot;ב">

                <div>
                    <label>תאריך:</label>
                    <input type="text" id="date" placeholder="DD/MM/YYYY">
                </div>
            </div>
        </div>
    </div>

                    המסע שלי
