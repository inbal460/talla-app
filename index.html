<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכנית לימודים אישית - המסע שלי</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #0f172a;
            --border-color: #e2e8f0;
            --border-hover: #38bdf8;
            --bg-clean: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Rubik', sans-serif;
            background-color: #ffffff;
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            direction: rtl;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 35px 30px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            position: relative;
            text-align: right;
        }

        /* כותרת מנהלים */
        .top-banner {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }

        .main-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }

        .main-title i {
            color: var(--primary);
            background: var(--primary-light);
            padding: 10px;
            border-radius: 12px;
            font-size: 24px;
        }

        /* תיבת פרטים אישיים */
        .personal-details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            text-align: right;
        }

        @media (max-width: 650px) {
            .details-grid { grid-template-columns: 1fr; }
        }

        .details-grid label {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-dark);
            display: block;
            margin-bottom: 6px;
            text-align: right;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .details-grid input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-align: right;
            direction: rtl;
        }

        .details-grid input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        #date {
            direction: ltr !important;
            text-align: center !important;
        }

        /* גריד 3 עמודות מעוצב */
        .flight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 25px;
        }

        @media (max-width: 850px) {
            .flight-grid { grid-template-columns: 1fr; }
        }

        .flight-column {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: border-color 0.2s;
            position: relative;
            text-align: right;
        }

        .flight-column:hover {
            border-color: #cbd5e1;
        }

        .col-header {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        label {
            font-weight: 700;
            font-size: 15px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            text-align: right;
        }

        .visual-icon {
            font-size: 20px;
            display: inline-block;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 110px;
            background: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .speech-btn {
            background: #f0f9ff;
            color: #0284c7;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            align-self: flex-start;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .speech-btn:hover {
            background: #e0f2fe;
        }

        .speech-btn.recording {
            background: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.65; }
            100% { opacity: 1; }
        }

        /* חתימות נקיות להדפסה */
        .signatures {
            margin-top: 35px;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .sig-box {
            background: #ffffff;
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .sig-line {
            margin-top: 40px;
            border-top: 1px solid #94a3b8;
        }

        /* כפתורי פרימיום */
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .btn-submit { background: #059669; color: white; }
        .btn-submit:hover { background: #047857; transform: translateY(-1px); }

        .btn-image { background: #0284c7; color: white; }
        .btn-image:hover { background: #0369a1; transform: translateY(-1px); }

        .btn-reset { background: #d97706; color: white; }
        .btn-reset:hover { background: #b45309; transform: translateY(-1px); }

        .btn:disabled {
            background: #cbd5e1 !important;
            color: #64748b !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            opacity: 0.75;
        }

        #statusMsg {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container" id="talaCard">
    
    <div class="top-banner">
        <div class="main-title">
            <i class="fa-solid fa-plane-departure"></i>
            תכנית לימודים אישית
        </div>
        
        <div class="personal-details-box">
            <div class="details-grid" id="detailsGrid">
                <div>
                    <label>שם מלא:</label>
                    <input type="text" id="fullName" placeholder="שם פרטי ומשפחה">
                </div>
                <div>
                    <label>כיתה:</label>
                    <input type="text" id="grade" placeholder="למשל: י&quot;ב">
                </div>
                <div>
                    <label>תאריך:</label>
                    <input type="text" id="date" placeholder="DD/MM/YYYY">
                </div>
            </div>
        </div>
    </div>

    <form id="talaForm">
        <div class="flight-grid" id="flightGrid">
            
            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🛣</span>
                    המסע שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💭</span> החלומות שלי:</label>
                    <textarea id="dreams" placeholder="מה היית רוצה להגשים?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('dreams', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">💪</span> החוזקות שלי:</label>
                    <textarea id="strengths" placeholder="במה אני טוב/ה?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('strengths', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🚧</span> המעכבים שלי:</label>
                    <textarea id="challenges" placeholder="מה מאתגר אותי?"></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('challenges', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <div class="flight-column" style="border-color: #7dd3fc;">
                <div class="col-header">
                    <span class="visual-icon">🎯</span>
                    המטרות שלי
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">📚</span> תחום לימודי:</label>
                    <textarea id="academicGoals" placeholder="מטרה לימודית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('academicGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">🤝</span> תחום חברתי:</label>
                    <textarea id="socialGoals" placeholder="מטרה חברתית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('socialGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>

                <div class="form-group">
                    <label><span class="visual-icon">❤️</span> מטרות אישיות:</label>
                    <textarea id="personalGoals" placeholder="מטרה אישית..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('personalGoals', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

            <div class="flight-column">
                <div class="col-header">
                    <span class="visual-icon">🗺️</span>
                    דרך הפעולה
                </div>

                <div class="form-group" style="flex:1;">
                    <label><span class="visual-icon">🚀</span> איך אשיג את המטרות שלי?</label>
                    <textarea id="howToAchieve" placeholder="צעדים מעשיים והעזרה שאצטרך..."></textarea>
                    <button type="button" class="speech-btn" onclick="toggleSpeech('howToAchieve', this)"><i class="fa-solid fa-microphone"></i> הקלט תשובה</button>
                </div>
            </div>

        </div>

        <div class="signatures">
            <div class="sig-box">
                <strong>חתימת התלמיד/ה</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת המחנכ/ת</strong>
                <div class="sig-line"></div>
            </div>
            <div class="sig-box">
                <strong>חתימת ההורה</strong>
                <div class="sig-line"></div>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-submit" onclick="sendToGoogleSheets()">
                <i class="fa-solid fa-paper-plane"></i> 1. שמור ושגר לגיליון
            </button>
            <button type="button" id="btnImage" class="btn btn-image" onclick="downloadAsA4Image()" disabled title="יש לשמור תחילה את הנתונים בגיליון">
                <i class="fa-solid fa-image"></i> 2. הורד תמונה לגלרייה (A4)
            </button>
            <button type="button" class="btn btn-reset" onclick="resetForm()">
                <i class="fa-solid fa-rotate-right"></i> טופס חדש
            </button>
        </div>
    </form>
</div>

<div id="statusMsg">⚠️ יש ללחוץ על "שמור ושגר לגיליון" לפני שניתן להוריד את התמונה.</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyPsVFHyRzHgLtlnTy7WbN31m8P2mgbA3_-Z3WjkQs34_ShKuhJOMZQzwB8U9yPFBj8g/exec";

    function getTodayIsraeliDate() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    function fixDateString(val) {
        if (!val) return getTodayIsraeliDate();
        if (val.includes('-')) {
            const parts = val.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        }
        return val;
    }

    const dateField = document.getElementById('date');
    const savedDate = localStorage.getItem('tala_date');
    dateField.value = fixDateString(savedDate);
    localStorage.setItem('tala_date', dateField.value);

    const fields = ['fullName', 'grade', 'date', 'dreams', 'strengths', 'challenges', 'academicGoals', 'socialGoals', 'personalGoals', 'howToAchieve'];
    
    fields.forEach(id => {
        const el = document.getElementById(id);
        if (id !== 'date') {
            const saved = localStorage.getItem('tala_' + id);
            if (saved) el.value = saved;
        }
        
        el.addEventListener('input', () => {
            localStorage.setItem('tala_' + id, el.value);
            lockActions();
        });
    });

    function lockActions() {
        document.getElementById('btnImage').disabled = true;
        const status = document.getElementById('statusMsg');
        status.style.color = '#d97706';
        status.innerText = '⚠️ בוצעו שינויים - יש ללחוץ על "1. שמור ושגר לגיליון" כדי לאפשר הורדת תמונה.';
    }

    function unlockActions() {
        document.getElementById('btnImage').disabled = false;
    }

    function sendToGoogleSheets() {
        const fullName = document.getElementById('fullName').value.trim();
        if (!fullName) {
            alert('אנא הזן שם מלא לפני השמירה.');
            return;
        }

        const status = document.getElementById('statusMsg');
        status.style.color = '#0284c7';
        status.innerText = '✈️ שולח נתונים לגיליון... אנא המתן';

        const payload = {
            fullName: fullName,
            grade: document.getElementById('grade').value,
            date: document.getElementById('date').value,
            dreams: document.getElementById('dreams').value,
            strengths: document.getElementById('strengths').value,
            challenges: document.getElementById('challenges').value,
            academicGoals: document.getElementById('academicGoals').value,
            socialGoals: document.getElementById('socialGoals').value,
            personalGoals: document.getElementById('personalGoals').value,
            howToAchieve: document.getElementById('howToAchieve').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            status.style.color = '#10b981';
            status.innerText = '🎉 הנתונים נשמרו בגיליון! כעת לחץ על "2. הורד תמונה לגלרייה" כדי לשמור את התמונה ולשלוח למורה ב-WhatsApp.';
            unlockActions();
        })
        .catch(err => {
            status.style.color = '#ef4444';
            status.innerText = 'שגיאה בשליחת הנתונים: ' + err.message;
        });
    }

    function downloadAsA4Image() {
        const status = document.getElementById('statusMsg');
        status.style.color = '#0284c7';
        status.innerText = '📸 מייצר תמונה מעוצבת בפורמט A4... אנא המתן';

        const card = document.getElementById('talaCard');
        const speechBtns = document.querySelectorAll('.speech-btn');
        const actionsBox = document.querySelector('.actions');
        const flightGrid = document.getElementById('flightGrid');
        const detailsGrid = document.getElementById('detailsGrid');

        speechBtns.forEach(btn => btn.style.display = 'none');
        actionsBox.style.display = 'none';

        const originalWidth = card.style.width;
        card.style.width = '1000px';
        flightGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';
        detailsGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';

        html2canvas(card, {
            scale: 2,
            useCORS: true,
            windowWidth: 1200,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            card.style.width = originalWidth;
            flightGrid.style.gridTemplateColumns = '';
            detailsGrid.style.gridTemplateColumns = '';
            speechBtns.forEach(btn => btn.style.display = 'flex');
            actionsBox.style.display = 'flex';

            const name = document.getElementById('fullName').value || 'תלמיד';
            const link = document.createElement('a');
            link.download = `תלא_${name}.png`.replace(/\s+/g, '_');
            link.href = canvas.toDataURL('image/png');
            link.click();

            status.style.color = '#10b981';
            status.innerText = '🖼️ התמונה המעוצבת נשמרה בגלריית המכשיר! כעת נכנסים ל-WhatsApp ושולחים אותה למורה.';
        }).catch(err => {
            card.style.width = originalWidth;
            flightGrid.style.gridTemplateColumns = '';
            detailsGrid.style.gridTemplateColumns = '';
            speechBtns.forEach(btn => btn.style.display = 'flex');
            actionsBox.style.display = 'flex';
            status.style.color = '#ef4444';
            status.innerText = 'שגיאה ביצירת התמונה: ' + err.message;
        });
    }

    function resetForm() {
        if (confirm('האם למחוק את כל התשובות מהמסך ולהתחיל טופס חדש?')) {
            fields.forEach(id => {
                const el = document.getElementById(id);
                el.value = '';
                localStorage.removeItem('tala_' + id);
            });
            document.getElementById('date').value = getTodayIsraeliDate();
            localStorage.setItem('tala_date', getTodayIsraeliDate());
            lockActions();
            const status = document.getElementById('statusMsg');
            status.style.color = '#f59e0b';
            status.innerText = '🧹 הטופס נוקה בהצלחה! יש למלא ולשמור לפני הורדת תמונה.';
        }
    }

    let currentRecognition = null;
    let currentBtn = null;

    function toggleSpeech(fieldId, btn) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('הדפדפן במכשיר זה אינו תומך בזיהוי קולי. מומלץ להשתמש בדפדפן Chrome.');
            return;
        }

        if (currentRecognition) {
            currentRecognition.stop();
            return;
        }

        const field = document.getElementById(fieldId);
        const initialText = field.value;

        currentRecognition = new SpeechRecognition();
        currentRecognition.lang = 'he-IL';
        currentRecognition.continuous = true;
        currentRecognition.interimResults = true;

        currentBtn = btn;
        btn.classList.add('recording');
        btn.innerHTML = '<i class="fa-solid fa-stop"></i> לחץ לסיום הקלטה';

        currentRecognition.onresult = function(event) {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                field.value = initialText + (initialText ? ' ' : '') + finalTranscript;
                field.dispatchEvent(new Event('input'));
            }
        };

        currentRecognition.onerror = function(event) {
            console.error("Speech recognition error:", event.error);
            stopSpeech();
        };

        currentRecognition.onend = function() {
            stopSpeech();
        };

        try {
            currentRecognition.start();
        } catch (e) {
            stopSpeech();
        }
    }

    function stopSpeech() {
        if (currentBtn) {
            currentBtn.classList.remove('recording');
            currentBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> הקלט תשובה';
        }
        currentRecognition = null;
        currentBtn = null;
    }
</script>

</body>
</html>
