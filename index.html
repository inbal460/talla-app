<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכנית לימודים אישית - המסע שלי</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --sky-bg: #e0f2fe;
            --primary-blue: #0284c7;
            --card-border: #38bdf8;
            --card-bg: #ffffff;
            --text: #0f172a;
            --tala-color: #0284c7; /* טורקיז-כחול לאותיות ת.ל.א */
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: #ffffff;
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            direction: rtl;
            min-height: 100vh;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.08);
            padding: 25px;
            border: 3px solid #38bdf8;
            position: relative;
            text-align: right;
        }

        .top-banner {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #7dd3fc;
            padding-bottom: 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        /* אותיות ת.ל.א בצבע טורקיז-כחול ללא עיבוי או רקע */
        .tala-letter {
            color: var(--tala-color);
            font-weight: 800;
        }

        /* מלבן פרטים אישיים ברוחב מלא עם צבע בולט וחי */
        .personal-details-box {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            border-radius: 16px;
            padding: 18px 22px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            text-align: right;
            width: 100%;
        }

        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
        }

        .details-grid label {
            font-size: 14px;
            font-weight: 700;
            color: #0369a1;
            display: block;
            margin-bottom: 6px;
            text-align: right;
        }

        .details-grid input {
            padding: 10px 14px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
            background: #ffffff;
            text-align: right;
            direction: rtl;
        }

        #date {
            direction: ltr !important;
            text-align: center !important;
        }

        .flight-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .flight-grid { grid-template-columns: 1fr; }
        }

        .flight-column {
            background: #ffffff;
            border: 3px solid #38bdf8;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            position: relative;
            text-align: right;
        }

        .col-header {
            font-size: 22px;
            font-weight: 800;
            color: #0369a1;
            text-align: center;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        label {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            text-align: right;
        }

        .visual-icon {
            font-size: 22px;
            display: inline-block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            min-height: 110px;
            background: #ffffff;
            line-height: 1.5;
            text-align: right;
            direction: rtl;
        }

        textarea:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .speech-btn {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #7dd3fc;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            align-self: flex-start;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .speech-btn.recording {
            background: #ef4444 !important;
            color: white !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .signatures {
            margin-top: 35px;
            border-top: 2px dashed #7dd3fc;
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .sig-box {
            background: #ffffff;
            padding: 18px 12px;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            font-size: 15px;
        }

        .sig-line {
            margin-top: 45px;
            border-top: 2px solid #475569;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
